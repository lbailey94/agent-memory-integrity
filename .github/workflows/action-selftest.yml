name: action-selftest

on:
  push:
    paths: ["action.yml", "agmi/check.py", ".github/workflows/action-selftest.yml"]
  pull_request:
    paths: ["action.yml", "agmi/check.py"]
  workflow_dispatch:

jobs:
  langgraph:
    # The action must run end to end and must fail on a store that accepts
    # edits. LangGraph's SqliteSaver accepts all eight, so the run is
    # expected to fail; continue-on-error turns that into the passing case.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: run
        uses: ./
        continue-on-error: true
        with:
          adapter: agmi.adapters.langgraph_sqlite:LangGraphSqliteAdapter
          extras: langgraph
      - name: The action failed the job on an accepting store, as designed
        if: steps.run.outcome != 'failure'
        run: |
          echo "expected the action to fail on LangGraph SqliteSaver"
          exit 1

  reference-atrest:
    # The self-validating reference store catches all eight edits by
    # construction, so the action must pass here. This is the positive case:
    # it proves the action can report a clean store as clean.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./
        with:
          adapter: agmi.adapters.reference_atrest:ReferenceAtRestAdapter

  inspeximus-receipts:
    # Receipts on: every edit the action runs is REPORTED (T1 to T9; T10 reads not
    # evaluable until the receipts adapter carries an erase hook). Cross-context replay (T6)
    # lands on the victim's own row (the victim pool is scoped to the first
    # context, issue #5) and the receipts report it, so the action passes.
    # If this job ever fails, a receipt change has opened a cell and the
    # scorecard row needs re-measuring.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./
        with:
          adapter: agmi.adapters.inspeximus_rows:InspeximusRowsSidecarAdapter
          extras: inspeximus
