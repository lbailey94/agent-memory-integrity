name: scorecard

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"   # weekly re-measurement against latest releases

jobs:
  measure:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,langgraph,openai-agents,llamaindex,letta,mem0,inspeximus]"
      - name: Install the W3C reference reader (declares Python 3.12 or later)
        if: matrix.python-version == '3.12'
        run: pip install -e ".[vectors]"
      - name: Lint (correctness only)
        run: ruff check agmi tests
      - name: Tests
        env:
          PYTHONPATH: .
          MEM0_TELEMETRY: "false"
        run: python -m pytest tests/ -q -p no:warnings
      - name: LangGraph encrypted-checkpointer replay (measured, not fatal)
        env:
          PYTHONPATH: .
        run: python -m agmi.replay
      - name: Scorecard
        env:
          PYTHONPATH: .
          MEM0_TELEMETRY: "false"
        run: |
          python agmi/full_runner.py --json results/ci-${{ matrix.python-version }}.json 2>/dev/null | grep -E "attack versions|\|"
      - name: Published tables match the committed results file
        env:
          PYTHONPATH: .
        run: python -m agmi.render results/scorecard.json docs/scorecard.md --check
      - name: The site matches the committed results file
        run: python site/build.py --check
      - name: The W3C v0.1 report matches the committed results file
        if: matrix.python-version == '3.12'
        env:
          PYTHONPATH: .
        run: python -m agmi.report_v01 results/scorecard.json results/report-v01.json --check
      - name: This run agrees with the committed results file on every cell both measured
        env:
          PYTHONPATH: .
        run: python -m agmi.render results/scorecard.json --compare results/ci-${{ matrix.python-version }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: scorecard-${{ matrix.python-version }}
          path: results/ci-${{ matrix.python-version }}.json

  embedder-rows:
    # The cells that rank with a real sentence embedder, measured by a
    # machine nobody owns. Opt-in locally; always here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-minilm-${{ runner.os }}-v1
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mem0,langgraph,letta,embedder]"
      - name: Embedder-tier tests
        env:
          PYTHONPATH: .
          MEM0_TELEMETRY: "false"
        run: python -m pytest tests/ -q -p no:warnings -m embedder
      - name: Front-door rows with a real embedder
        env:
          PYTHONPATH: .
          MEM0_TELEMETRY: "false"
        run: |
          python -m agmi.measure --target mem0 --embedder minilm 2>/dev/null
          python -m agmi.measure --target langgraph-store --embedder minilm 2>/dev/null
          python -m agmi.measure --target letta-archival --embedder minilm 2>/dev/null

  corpus-drift:
    # The vendored anchored-chain cases in tests/vectors are what the suite
    # asserts against, so the pinned test stands on its own. This job runs the
    # published corpus through the same verifier, so drift between the two
    # shows up here rather than in a result nobody re-checked. It reports and
    # never blocks: a corpus release moving is not a defect in this repo.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,vectors]"
      - name: The vendored cases still agree with the verifier
        env:
          PYTHONPATH: .
        run: python -m pytest tests/test_anchored_chain_vectors.py -q -p no:warnings
      - name: The published corpus agrees with the verifier
        env:
          PYTHONPATH: .
        run: |
          agent-evidence-vectors --corpus vectors-anchored-chain \
            --verifier "python -m agmi.anchored_chain"
